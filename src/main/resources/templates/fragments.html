<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Mail System</title>
    <style>
        :root { --accent:#2563eb; --bg:#f5f6f8; --border:#e2e5ea; --muted:#6b7280; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
               margin: 0; background: var(--bg); color: #1f2937; }
        header { background: #111827; color: #fff; padding: 0 24px; }
        header .bar { display: flex; align-items: center; gap: 24px; max-width: 1100px; margin: 0 auto; height: 56px; }
        header .brand { font-weight: 700; font-size: 18px; }
        header a { color: #d1d5db; text-decoration: none; font-size: 14px; }
        header a:hover { color: #fff; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        h2 { font-size: 17px; margin: 24px 0 8px; }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 18px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
        a.link { color: var(--accent); text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
        input[type=text], input[type=email], textarea, select {
            width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .btn { display: inline-block; background: var(--accent); color: #fff; border: none; padding: 9px 16px;
               border-radius: 7px; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .btn.secondary { background: #fff; color: #374151; border: 1px solid var(--border); }
        .btn.danger { background: #dc2626; }
        .btn.small { padding: 5px 10px; font-size: 13px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .spacer { flex: 1; }
        .muted { color: var(--muted); font-size: 13px; }
        .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .pill.SENT { background: #e5e7eb; color: #374151; }
        .pill.RECEIVED { background: #dbeafe; color: #1e40af; }
        .pill.READ { background: #dcfce7; color: #166534; }
        .pill.REPLIED { background: #ede9fe; color: #5b21b6; }
        .pill.BOUNCED { background: #fee2e2; color: #991b1b; }
        .pill.FAILED { background: #fef3c7; color: #92400e; }
        .stat { display: inline-block; min-width: 90px; padding: 12px 16px; background: #fff; border: 1px solid var(--border);
                border-radius: 10px; margin-right: 10px; }
        .stat .n { font-size: 24px; font-weight: 700; }
        .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
        .alert { padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert.ok { background: #dcfce7; color: #166534; }
        .alert.err { background: #fee2e2; color: #991b1b; }
        .reply { background: #faf5ff; border-left: 3px solid #8b5cf6; padding: 8px 12px; margin: 6px 0; border-radius: 0 6px 6px 0; font-size: 13px; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <header>
        <div class="bar">
            <span class="brand">📬 Gmail Mailing System</span>
            <a th:href="@{/campaigns}">Campaigns</a>
            <a th:href="@{/lists}">Mailing Lists</a>
            <a th:href="@{/compose}">Compose</a>
            <span class="spacer" style="flex:1"></span>
            <form th:action="@{/scan}" method="post" style="margin:0">
                <button class="btn small secondary" type="submit" title="Read the Gmail mailbox now to detect bounces and replies">↻ Sync mailbox</button>
            </form>
        </div>
    </header>
</nav>

<div th:fragment="alerts">
    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert err" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
