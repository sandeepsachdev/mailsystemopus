<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mailing List')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <div th:replace="~{fragments :: alerts}"></div>
    <p><a class="link" th:href="@{/lists}">← All lists</a></p>
    <h1 th:text="${list.id == null} ? 'New mailing list' : 'Edit mailing list'">New mailing list</h1>

    <div class="card">
        <form th:action="${list.id == null} ? @{/lists} : @{/lists/{id}(id=${list.id})}" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" th:value="${list.name}" required/>

            <label for="description">Description</label>
            <input type="text" id="description" name="description" th:value="${list.description}"/>

            <label for="recipients">Recipients</label>
            <textarea id="recipients" name="recipients"
                      placeholder="One per line, or comma/space separated"
                      th:text="${list.recipients != null} ? ${#strings.setJoin(list.recipients, ', ')} : ''"></textarea>
            <p class="muted">Invalid or duplicate addresses are ignored automatically.</p>

            <div class="row" style="margin-top:16px">
                <button class="btn" type="submit">Save</button>
                <a class="btn secondary" th:href="@{/lists}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
